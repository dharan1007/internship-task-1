experiment: eyepacs_vim_base_cuda_fp16_t4x2
seed: 2026
model:
  image_size: 1536
  patch_size: 16
  depth: 24
  embed_dim: 768
  state_dim: 16
  expansion: 2
  conv_kernel: 4
  num_classes: 5
  scan_backend: cuda_kernel
  activation_checkpointing: true
  drop_path_rate: 0.1
data:
  batch_size: 4
  workers: 2
  pin_memory: true
  image_policy: preserve_full_field
train:
  epochs: 300
  learning_rate: 0.0001
  weight_decay: 0.05
  warmup_epochs: 5
  grad_accum_steps: 2
  amp: fp16
  grad_scaler_init_scale: 1024
  max_consecutive_overflows: 8
  max_grad_norm: 1.0
  validation_metric: qwk
